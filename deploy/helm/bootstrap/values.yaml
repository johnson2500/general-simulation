image: quay.io/robertsandoval/general-sim-app:latest

# Block bootstrap until Postgres + Neo4j accept TCP connections.
waitFor:
  enabled: true
  timeoutSeconds: 300

postgres:
  # Short name — resolves in the release namespace (standalone or as a subchart).
  host: postgres
  port: 5432
  user: sim
  password: ""   # required — pass via --set postgres.password=<pw>
  database: sim

neo4j:
  # Short name — same-namespace Service DNS.
  host: neo4j
  port: 7687
  user: neo4j
  password: ""   # required — pass via --set neo4j.password=<pw>

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 250m
