apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "vllm.selectorLabels" . | nindent 8 }}
    spec:
      # A Service named "vllm" would inject VLLM_PORT=tcp://... into the pod;
      # vLLM reads VLLM_PORT as an int and crashes. Disable service links.
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: vllm
          image: {{ .Values.image }}
          imagePullPolicy: Always
          args:
            - --model
            - {{ .Values.model.id | quote }}
            - --port
            - "8080"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - {{ .Values.model.toolCallParser | quote }}
            - --max-model-len
            - {{ .Values.model.maxModelLen | quote }}
            - --served-model-name
            - {{ .Values.model.id | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.hfToken }}
            - name: HF_TOKEN
              value: {{ .Values.hfToken | quote }}
            {{- end }}
            # OpenShift assigns an arbitrary UID (e.g. 1001190000) that is not
            # in /etc/passwd. PyTorch calls getpass.getuser() at import time and
            # crashes unless USER/HOME are set. Cache dirs must be writable.
            - name: USER
              value: vllm
            - name: HOME
              value: /models
            - name: HF_HOME
              value: /models/.cache
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /models/.torch_inductor
            - name: XDG_CACHE_HOME
              value: /models/.cache
            - name: TOKENIZERS_PARALLELISM
              value: "false"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
