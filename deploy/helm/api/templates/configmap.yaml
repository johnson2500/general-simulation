apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_BACKEND: {{ .Values.llm.backend | quote }}
  GENERATION_MODEL_ID: {{ .Values.models.generation | quote }}
  EMBEDDING_MODEL_ID: {{ .Values.models.embedding | quote }}
  EMBEDDING_DIMENSION: {{ .Values.models.embeddingDimension | quote }}
  ENABLED_DOMAINS: {{ .Values.enabledDomains | quote }}
  NEO4J_USER: {{ .Values.neo4j.user | quote }}
  # Lifespan retries Postgres/Neo4j until pools are ready (see src.core.db).
  STARTUP_DB_WAIT_SECONDS: {{ .Values.waitFor.timeoutSeconds | quote }}
  STARTUP_DB_WAIT_INTERVAL_SECONDS: "2"
