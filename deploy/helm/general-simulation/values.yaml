# Default values for the general-simulation umbrella chart.
# Works standalone (`helm install -n <ns>`) and as a subchart of a parent chart.
#
# In-cluster Service DNS uses short names (same namespace). Cross-namespace
# clients should use <service>.<namespace>.svc
# (e.g. general-sim-api.general-simulation.svc).
#
# Secrets: never commit passwords. Pass via --set or a secrets overlay:
#   --set postgres.postgres.password=<pw>
#   --set api.postgres.password=<pw> --set api.neo4j.password=<pw>
#   --set bootstrap.postgres.password=<pw> --set bootstrap.neo4j.password=<pw>
#   --set ingestion.postgres.password=<pw> --set ingestion.neo4j.password=<pw>
# Neo4j: pre-create Secret neo4j-auth with NEO4J_AUTH=neo4j/<password>
#   (see README), or override neo4j.neo4j.passwordFromSecret / chart password.

# ── Postgres (always on for this platform) ────────────────────────────────────
postgres:
  enabled: true
  postgres:
    username: sim
    password: ""
    database: sim

# ── Neo4j (official neo4j/neo4j chart) ────────────────────────────────────────
neo4j:
  enabled: true
  config:
    server.bolt.advertised_address: ":443"
    server.http.advertised_address: ":443"
  neo4j:
    acceptLicenseAgreement: "yes"
    edition: community
    name: neo4j
    passwordFromSecret: neo4j-auth
    resources:
      cpu: "2"
      memory: 4Gi
  # OpenShift: neo4j-sa + anyuid SCC (created by make deploy-umbrella).
  podSpec:
    serviceAccountName: neo4j-sa
  services:
    neo4j:
      enabled: false
  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        accessModes:
          - ReadWriteOnce
        requests:
          storage: 10Gi

# ── Schema bootstrap Job ──────────────────────────────────────────────────────
bootstrap:
  enabled: true
  waitFor:
    enabled: true
    timeoutSeconds: 300
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""

# ── Optional vLLM (off by default; clients often bring their own LLM) ─────────
vllm:
  enabled: false
# ── FastAPI API (Service name: general-sim-api, port 8000) ─────────────────────
api:
  enabled: true
  # OpenShift Route; disable on Kind / plain Kubernetes.
  route:
    enabled: true
  # Init container + lifespan retries: Postgres/Neo4j before serving traffic.
  waitFor:
    enabled: true
    timeoutSeconds: 300
    startupFailureThreshold: 60
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""
  llm:
    baseUrl: "https://api.openai.com/v1"
    apiKey: ""
    backend: "openai"
  enabledDomains: aviation,shipping

# ── Ingestion CronJob ─────────────────────────────────────────────────────────
ingestion:
  enabled: true
  postgres:
    host: postgres
    port: 5432
    user: sim
    password: ""
    database: sim
  neo4j:
    host: neo4j
    port: 7687
    user: neo4j
    password: ""
  llm:
    baseUrl: "https://api.openai.com/v1"
    apiKey: ""
    backend: "openai"
  enabledDomains: aviation,shipping
  adapterId: opensky_flights
