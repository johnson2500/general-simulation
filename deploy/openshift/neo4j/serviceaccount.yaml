# ServiceAccount used by the Neo4j Pod.
# Needs the "anyuid" SCC (see scc-binding.yaml) so the container can run as
# UID/GID 7474 (the neo4j user hard-coded by the official neo4j/neo4j chart).
#
# Applied by `make deploy-neo4j` / `make deploy-umbrella`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neo4j-sa
  labels:
    app.kubernetes.io/part-of: general-sim
    app.kubernetes.io/component: neo4j
