image: docker.io/vllm/vllm-openai:v0.6.3

model:
  # Hugging Face repo id (Llama-derived — gated; requires hfToken / HF_TOKEN).
  # Weights download into the PVC via HF_HOME on first start.
  # FP8 fits a 12 GiB GPU with maxModelLen 8192; drop to 4096 if you OOM.
  id: RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8
  # Tool-call parser matching the Llama 3.1 chat template.
  toolCallParser: llama3_json
  maxModelLen: 8192

# Hugging Face token — required for gated Llama-derived models.
# Pass via: make deploy-vllm HF_TOKEN=<token>
# or:      helm upgrade ... --set hfToken=<token>
hfToken: ""

storage:
  # Cache for HF downloads (HF_HOME=/models/.cache). ~8–10 Gi for 8B FP8.
  size: 30Gi
  # storageClassName: ""

# GPU resource requests/limits.
# Requires the NVIDIA device plugin DaemonSet on the cluster.
resources:
  requests:
    memory: 16Gi
    cpu: "4"
    nvidia.com/gpu: "1"
  limits:
    memory: 24Gi
    cpu: "8"
    nvidia.com/gpu: "1"

# Node selector to land the pod on a GPU node.
nodeSelector:
  nvidia.com/gpu.present: "true"

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
